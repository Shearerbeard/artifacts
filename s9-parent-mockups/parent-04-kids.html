<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Parent UI 04 - Kids</title>
<!-- Token values from docs/ux/design/tokens.json (chore-chart v1); inlined so this file opens standalone. -->
<style>
:root {
  --ink: #191817; --paper: #FDFCF7; --accent: #2450C8; --accent2: #2F9E5B;
  --muted: #6E6A63; --warn: #C77F0A; --danger: #C03A2B; --border: #191817;
  --surface: #F2F1EA; --radius: 16px;
  --font-display: ui-rounded, 'SF Pro Rounded', 'Segoe UI Rounded', system-ui, sans-serif;
  --font-body: system-ui, -apple-system, 'Segoe UI', sans-serif;
  --font-utility: system-ui, -apple-system, 'Segoe UI', sans-serif;
  --text-s: 14px; --text-m: 18px; --text-l: 22px; --text-xl: 28px;
  --text-xxl: 35px; --text-xxxl: 44px;
  --space-1: 4px; --space-2: 8px; --space-3: 12px; --space-4: 16px;
  --space-6: 24px; --space-8: 32px; --space-12: 48px;
}
@media (prefers-color-scheme: dark) {
  :root {
    --ink: #F4F2EC; --paper: #17181C; --accent: #8AABFF; --accent2: #62D69A;
    --muted: #A39E94; --warn: #E5A53D; --danger: #E4695A; --border: #F4F2EC;
    --surface: #212329;
  }
}
* { margin: 0; box-sizing: border-box; }
body { background: var(--surface); font-family: var(--font-body); color: var(--ink); }
.statetag { max-width: 44rem; margin: 0 auto; padding: var(--space-3) var(--space-4); color: var(--muted); font-family: var(--font-utility); font-weight: 600; font-size: 13px; letter-spacing: .08em; text-transform: uppercase; display: flex; justify-content: space-between; }
.page { max-width: 44rem; margin: 0 auto var(--space-12); background: var(--paper); border: 3px solid var(--border); border-radius: var(--radius); padding: var(--space-6); display: flex; flex-direction: column; gap: var(--space-6); }
.topbar { display: flex; align-items: baseline; justify-content: space-between; gap: var(--space-4); flex-wrap: wrap; }
h1.app { font-family: var(--font-display); font-weight: 800; font-size: var(--text-m); text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
nav { display: flex; gap: var(--space-4); font-family: var(--font-utility); font-weight: 600; font-size: var(--text-m); }
nav a { color: var(--muted); text-decoration: none; }
nav a[aria-current] { color: var(--accent); border-bottom: 3px solid var(--accent); }
h2.sec { font-family: var(--font-display); font-weight: 800; font-size: var(--text-l); }
.kid { border: 3px solid var(--border); border-radius: var(--radius); padding: var(--space-4); display: flex; align-items: center; justify-content: space-between; gap: var(--space-4); flex-wrap: wrap; }
.kidname { font-family: var(--font-display); font-weight: 800; font-size: var(--text-l); }
.kidmeta { color: var(--muted); font-size: var(--text-s); font-family: var(--font-utility); font-weight: 600; }
.kid .actions { display: flex; gap: var(--space-2); }
.btn { font-family: var(--font-utility); font-weight: 600; font-size: var(--text-m); border: 3px solid var(--border); border-radius: var(--radius); padding: var(--space-2) var(--space-4); background: var(--paper); color: var(--ink); cursor: pointer; text-decoration: none; }
.btn.warn { color: var(--warn); border-color: var(--warn); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--paper); }
.addform { border: 3px dashed var(--border); border-radius: var(--radius); padding: var(--space-4); display: flex; flex-direction: column; gap: var(--space-3); }
.addform label { font-family: var(--font-utility); font-weight: 600; font-size: var(--text-s); color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
.addform input { font-family: var(--font-body); font-size: var(--text-m); padding: var(--space-3); border: 3px solid var(--border); border-radius: var(--radius); background: var(--paper); color: var(--ink); }
.addform .hint { color: var(--muted); font-size: var(--text-s); }
.addform .actions { display: flex; justify-content: flex-end; }
</style>
</head>
<body>
<div class="statetag"><span>State 4 - Kids</span><span>mockup, not interactive</span></div>
<main class="page">
  <div class="topbar">
    <h1 class="app">Chore chart</h1>
    <nav>
      <a href="#">Overview</a>
      <a href="#">Boards</a>
      <a href="#" aria-current="page">Kids</a>
    </nav>
  </div>

  <h2 class="sec">Kids</h2>

  <section class="kid" aria-label="Ada">
    <div>
      <p class="kidname">Ada</p>
      <p class="kidmeta">Added Aug 3</p>
    </div>
    <div class="actions">
      <a class="btn" href="#">Show QR</a>
      <button class="btn warn" type="button">Regenerate</button>
    </div>
  </section>

  <section class="kid" aria-label="Ben">
    <div>
      <p class="kidname">Ben</p>
      <p class="kidmeta">Added Aug 3</p>
    </div>
    <div class="actions">
      <a class="btn" href="#">Show QR</a>
      <button class="btn warn" type="button">Regenerate</button>
    </div>
  </section>

  <h2 class="sec">Add a kid</h2>
  <form class="addform">
    <label for="kidname">Name</label>
    <input id="kidname" type="text" placeholder="Cleo">
    <p class="hint">This makes the kid's personal link and QR code. The link is the whole login - anyone who has it sees that kid's card.</p>
    <div class="actions">
      <button class="btn primary" type="submit">Add kid</button>
    </div>
  </form>
</main>
</body>
</html>
